<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="CloudBridge coverage animation">
  <defs>
    <linearGradient id="cbCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="cbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="400" cy="300" r="250" fill="url(#cbGlow)" />

  <!-- Globe -->
  <circle cx="400" cy="300" r="180" fill="#6366f1" fill-opacity="0.05" stroke="url(#cbCover)" stroke-width="2.5" />
  <ellipse cx="400" cy="300" rx="180" ry="70" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" />
  <ellipse cx="400" cy="300" rx="70" ry="180" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" />
  <line x1="220" y1="300" x2="580" y2="300" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Hub -->
  <circle cx="400" cy="300" r="9" fill="url(#cbCover)" />

  <!-- Beams -->
  <g stroke="url(#cbCover)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 14">
    <line x1="400" y1="300" x2="527" y2="427">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="300" x2="273" y2="427">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.3s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="300" x2="273" y2="173">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="300" x2="527" y2="173">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Site nodes -->
  <g fill="url(#cbCover)">
    <g transform="translate(527 427)">
      <circle r="7" />
      <circle r="7" fill="none" stroke="#6366f1" stroke-width="2">
        <animate attributeName="r" from="7" to="22" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>
    <g transform="translate(273 427)">
      <circle r="7" />
      <circle r="7" fill="none" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="r" from="7" to="22" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
      </circle>
    </g>
    <g transform="translate(273 173)">
      <circle r="7" />
      <circle r="7" fill="none" stroke="#6366f1" stroke-width="2">
        <animate attributeName="r" from="7" to="22" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      </circle>
    </g>
    <g transform="translate(527 173)">
      <circle r="7" />
      <circle r="7" fill="none" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="r" from="7" to="22" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Orbiting satellite -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="14s" repeatCount="indefinite" />
    <g transform="translate(400 78)">
      <rect x="-14" y="-9" width="28" height="18" rx="4" fill="url(#cbCover)" />
      <path d="M0 -9 L22 -26 A26 26 0 0 1 22 -2 Z" fill="#6366f1" fill-opacity="0.35" stroke="url(#cbCover)" stroke-width="2" />
      <line x1="-14" y1="9" x2="-14" y2="18" stroke="#6366f1" stroke-width="3" />
      <line x1="14" y1="9" x2="14" y2="18" stroke="#6366f1" stroke-width="3" />
    </g>
  </g>
</svg>
