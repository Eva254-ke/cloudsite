<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none" role="img" aria-label="CloudBridge console demo">
  <defs>
    <linearGradient id="cbDash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="cbArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect x="40" y="40" width="880" height="520" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <rect x="40" y="40" width="880" height="58" rx="22" fill="#f8fafc" />
  <rect x="40" y="82" width="880" height="16" fill="#f8fafc" />
  <line x1="40" y1="98" x2="920" y2="98" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="70" cy="69" r="7" fill="#ff5f57" />
  <circle cx="94" cy="69" r="7" fill="#febc2e" />
  <circle cx="118" cy="69" r="7" fill="#28c840" />
  <text x="150" y="75" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">CloudBridge Console</text>

  <!-- Sidebar -->
  <rect x="40" y="98" width="170" height="462" fill="#f8fafc" />
  <line x1="210" y1="98" x2="210" y2="560" stroke="#e2e8f0" stroke-width="2" />
  <rect x="64" y="128" width="122" height="34" rx="9" fill="url(#cbDash)" />
  <text x="84" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Overview</text>
  <rect x="64" y="176" width="122" height="30" rx="8" fill="#eef2f9" />
  <rect x="64" y="216" width="122" height="30" rx="8" fill="#eef2f9" />
  <rect x="64" y="256" width="122" height="30" rx="8" fill="#eef2f9" />
  <rect x="64" y="296" width="122" height="30" rx="8" fill="#eef2f9" />

  <!-- Uptime card -->
  <rect x="234" y="118" width="320" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="258" y="152" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Network uptime</text>
  <text x="258" y="206" fill="#0b1020" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">99.98%</text>
  <circle cx="520" cy="146" r="7" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="536" y="152" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">LIVE</text>

  <!-- Active sites card -->
  <rect x="574" y="118" width="326" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="598" y="152" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Sites online</text>
  <text x="598" y="206" fill="#0b1020" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">312</text>
  <rect x="760" y="166" width="120" height="40" rx="10" fill="url(#cbDash)" />
  <text x="784" y="192" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Manage</text>

  <!-- Line chart card -->
  <rect x="234" y="258" width="360" height="254" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="258" y="292" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Throughput (24h)</text>
  <path d="M258 488 L258 470 L298 446 L338 458 L378 418 L418 436 L458 392 L498 408 L538 372 L578 398 L578 488 Z" fill="url(#cbArea)" />
  <path d="M258 470 L298 446 L338 458 L378 418 L418 436 L458 392 L498 408 L538 372 L578 398" fill="none" stroke="url(#cbDash)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.6s" repeatCount="indefinite" />
  </path>

  <!-- Bars card -->
  <rect x="614" y="258" width="286" height="254" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="638" y="292" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Regions</text>
  <g fill="url(#cbDash)">
    <rect x="640" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;90;70;100" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;380;400;370" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <rect x="682" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;120;80;130" dur="3.6s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;350;390;340" dur="3.6s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <rect x="724" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;70;110;60" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;400;360;410" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
    </rect>
    <rect x="766" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;100;60;120" dur="3.6s" begin="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;370;410;350" dur="3.6s" begin="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="808" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;80;120;90" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;390;350;380" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="850" y="470" width="26" height="0" rx="6">
      <animate attributeName="height" values="0;110;70;130" dur="3.6s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="470;360;400;340" dur="3.6s" begin="1.5s" repeatCount="indefinite" />
    </rect>
  </g>
  <line x1="634" y1="470" x2="882" y2="470" stroke="#cbd5e1" stroke-width="2" />
</svg>
